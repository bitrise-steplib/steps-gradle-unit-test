format_version: "20"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: steps.bitrise.yml

app:
  envs:
  - ORIG_BITRISE_SOURCE_DIR: $BITRISE_SOURCE_DIR

workflows:
  # check: included from steps-check/steps.bitrise.yml

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    steps:
    - script:
        inputs:
        - content: rm -rf "${ORIG_BITRISE_SOURCE_DIR}/_tmp"
    - change-workdir:
        is_always_run: true
        inputs:
        - path: ${ORIG_BITRISE_SOURCE_DIR}/_tmp
        - is_create_path: true
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git@master:
        inputs:
        - repository_url: https://github.com/bitrise-samples/android-gradle-kotlin-dsl.git
        - branch: master
        - clone_into_dir: ./
    - path::./:
        inputs:
        - project_root_dir: ./

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: {}
